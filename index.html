<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakura-SAR ダッシュボード（試作）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Sakura-SAR<span class="subtitle">桜島 観光防災ダッシュボード（試作）</span></h1>
    <button id="darkModeToggle" class="toggle-btn" aria-label="ダークモード切替">🌙 ダークモード</button>
  </header>

  <div class="banner">
    ※ これはプロトタイプです。表示されている変動画像・数値はダミーデータです。
  </div>

  <main class="app-main">
    <section class="map-panel">
      <div id="map"></div>
    </section>

    <section class="info-panel">
      <div class="date-selector" id="dateSelector">
        <!-- JSで生成 -->
      </div>

      <div class="result-card">
        <div class="result-header">
          <h2 id="resultTitle">解析結果</h2>
          <span id="confidenceBadge" class="badge">-</span>
        </div>
        <img id="resultImage" src="" alt="InSAR変動可視化画像" class="result-image">
        <p id="resultSummary" class="result-summary">日付を選択してください。</p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Sakura-SAR / ISHIN2026 鹿児島版AKATSUKIプロジェクト（プロトタイプ）</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
